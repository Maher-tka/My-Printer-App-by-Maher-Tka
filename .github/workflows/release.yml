name: Release Windows app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PRINTER_SUPABASE_URL: ${{ vars.PRINTER_SUPABASE_URL }}
      PRINTER_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PRINTER_SUPABASE_PUBLISHABLE_KEY }}
      EP_PRE_RELEASE: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          if ($packageVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match package.json version $packageVersion."
          }

      - name: Verify account service configuration
        shell: pwsh
        run: |
          if (!$env:PRINTER_SUPABASE_URL -or !$env:PRINTER_SUPABASE_PUBLISHABLE_KEY) {
            throw 'Set PRINTER_SUPABASE_URL and PRINTER_SUPABASE_PUBLISHABLE_KEY repository variables before publishing.'
          }

      - name: Build, test, and publish Windows workshop packages
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

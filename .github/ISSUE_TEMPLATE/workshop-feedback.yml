name: Workshop feedback
description: Report a v0.2.0 workshop test result, problem, or improvement.
title: '[Workshop 0.2.0] '
body:
  - type: dropdown
    id: tool
    attributes:
      label: Tool or workflow
      options:
        - Installation / account access
        - Dashboard / appearance
        - Booklet Montage
        - Cutter Montage / stickers
        - Hardcover Cover
        - Sequential Number
        - Fast Print
        - Jobs / quotes / exports
        - Autosave / backup / recovery
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Workshop PC and equipment
      description: App version, Setup or Portable, Windows version, RAM, printer/cutter model and driver, and paper size.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the input file type/page count and relevant settings.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
      description: Include measured dimensions or numbering/page-order differences when relevant.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocks printing or exporting
        - Incorrect printed or cut output
        - Crash or lost work
        - Slow performance
        - Interface or usability issue
        - Improvement suggestion
        - Successful test result
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Diagnostics and samples
      description: Attach an App Health diagnostic report, screenshot, or anonymized sample. Review attachments and remove customer information before posting publicly.
